name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: pytest --cov=core --cov=activities --cov=orchestrators --cov=function_app --cov-report=term-missing --cov-report=xml
      - run: pip-audit -r src/requirements.txt --no-deps --disable-pip
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: az bicep install --version v0.49.2
      - run: az bicep build --file infra/main.bicep --outfile /tmp/main.json
      - run: az bicep build --file infra/scheduler.bicep --outfile /tmp/scheduler.json
      - run: python scripts/check_infrastructure.py /tmp/main.json
