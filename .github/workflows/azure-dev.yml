name: Azure integration (explicit deployment)
on:
  workflow_dispatch:
    inputs:
      acknowledge_cost:
        description: 'Provision temporary Azure resources and run integration tests'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: azure-integration
  cancel-in-progress: false
jobs:
  integration:
    if: inputs.acknowledge_cost
    environment: test
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      AZURE_ENV_NAME: integration-${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: python -m pip install -r requirements-dev.txt
      - run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
      - run: azd env new "$AZURE_ENV_NAME" --no-prompt
      - run: azd env set ENTRA_CLIENT_ID "$ENTRA_CLIENT_ID"
      - run: azd provision --no-prompt
      - name: Grant temporary test data permissions
        run: python scripts/integration_roles.py
      - run: azd deploy --no-prompt
      - name: Run authenticated lifecycle integration tests
        run: python tests/e2e/test_e2e.py
      - name: Remove temporary infrastructure
        if: always()
        run: azd down --purge --force --no-prompt
