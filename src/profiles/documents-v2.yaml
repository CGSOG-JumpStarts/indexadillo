profile_id: documents-v2
embedding:
  deployment: embedding
  model: text-embedding-3-large
  dimensions: 3072
  max_batch_tokens: 16000
  max_batch_items: 32
extraction:
  provider: document-intelligence
  api_version: '2024-11-30'
  analyzer: prebuilt-layout
  output: markdown
  max_bytes: 50000000
chunking:
  strategy: section-aware
  target_tokens: 512
  overlap_tokens: 64
  encoding: cl100k_base
  max_chunks: 512
index:
  schema_version: 2
  api_version: '2026-04-01'
  compression: scalar
enrichment:
  enabled: false
  deployment: ''
  model: gpt-6-luna
  fallback_deployment: ''
  fallback_model: gpt-6.1-sol
  reasoning_effort: low
  verbosity: low
  max_input_tokens: 8000
  max_output_tokens: 2048
